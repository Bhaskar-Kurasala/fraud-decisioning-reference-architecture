# The one Grafana setting that is an architectural decision rather than a preference.
#
# ADR-0002: "'Every service has a golden-signals dashboard' is necessary and insufficient.
# All four can be green while the system is at its most expensive." So the landing page is
# business P&L and the golden signals are one layer down. Whoever opens Grafana during an
# incident sees dollars first and latency second, which is the inversion the measurement in
# E1 justifies -- a model 0.0021 AUC below champion costs $4.36M/yr while every serving
# signal stays flat green.

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/00-executive.json

[users]
home_page = /d/fraudlens-executive

[auth.anonymous]
# Single-node demo stack (ADR-0002 rules out the multi-tenant topology that would make
# real auth meaningful). Viewer-only so a reader cannot mutate a panel; the provisioning
# provider above already forbids that, this is the second lock.
enabled = true
org_role = Viewer
