# Dashboards are provisioned from disk and not editable in the UI.
#
# `allowUiUpdates: false` is the load-bearing setting. A dashboard edited in the browser
# during an incident is a dashboard nobody can reproduce afterwards, and the panel that
# was changed is invariably the one whose reading led to the decision under review. The
# dashboards live in git; changing one is a commit.

apiVersion: 1

providers:
  - name: fraudlens
    orgId: 1
    folder: FraudLens
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
