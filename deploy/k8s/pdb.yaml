# What a node drain is allowed to do to the checkout path.
#
# `minAvailable: 1` rather than `maxUnavailable: 1`. With two replicas the two are
# arithmetically identical today, and they stop being identical the moment someone changes
# the replica count — at which point `maxUnavailable: 1` still permits exactly one
# eviction at a time while `minAvailable: 1` permits draining everything but one pod. The
# question the operator is actually answering is "how much scoring capacity must survive a
# cluster operation", and that is a floor, not a rate.
#
# The deliberate consequence: a single-node cluster cannot be drained without the
# disruption budget blocking it, and that is correct. Evicting the last scoring pod means
# every checkout in flight gets a connection failure instead of a decision, and a node
# upgrade is not an emergency. Someone deleting the PDB to unblock a drain is a decision
# with a name on it, which is the whole point of writing it down.
#
# ADR-0002 declines HA topology, and this does not contradict that. A PDB is not
# availability engineering — it is a statement of what an automated process may do without
# asking, and it costs one object.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudlens-api
  labels:
    app.kubernetes.io/name: fraudlens
    app.kubernetes.io/component: scoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraudlens
      app.kubernetes.io/component: scoring
