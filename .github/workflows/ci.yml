name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.10

      - name: Install
        run: uv sync --all-extras --dev

      # research/ is excluded: those files are the provenance of the published
      # findings (ADR-0001) and are preserved exactly as they ran. They carry 14
      # known pyflakes findings — unused imports, and one F821 false positive
      # where fit() closes over a module-level name that is later deleted.
      # Recorded in docs/findings/verification-report.md rather than fixed,
      # because editing them would mean the committed code is no longer the code
      # that produced the numbers.
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # Tracked separately so regressions in the research tree are visible
      # without blocking the build on a deliberate exemption.
      - name: Lint research (advisory)
        continue-on-error: true
        run: uv run ruff check research --output-format=concise

      - name: Type check
        run: uv run mypy

      # Guards the dependency direction declared in pyproject.toml. Without
      # this, the layering is a comment rather than a constraint.
      - name: Architecture contracts
        run: uv run lint-imports

      # Golden tests are separated so a failure is unambiguous: it means a
      # published finding changed, which is a decision to make rather than a
      # bug to fix quietly.
      - name: Unit tests
        run: uv run pytest -m "not golden and not integration and not slow" --cov=src/fraudlens --cov-report=term-missing

      - name: Golden-value tests (published findings)
        run: uv run pytest -m golden -v

  # Separate job because it needs tools the quality job does not, and because its failure
  # means something different: the library is fine and the thing that ships it is not.
  #
  # It deliberately does NOT run the integration or degradation drills. Those need the
  # compose stack, a Postgres volume and a model artifact built from the git-ignored
  # dataset, and a CI job that quietly skips half of what it claims to run is worse than
  # one that does not claim it. They run locally; docs/operations/running-the-stack.md says
  # how, and the numbers they produced are recorded there.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.10

      - name: Install
        run: uv sync --all-extras --dev

      # Pinned. A validator that updates itself turns "the manifests changed" and "the
      # schemas changed" into the same red build, and only one of those is our problem.
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # The Dockerfile is the one artifact in this epic whose correctness cannot be asserted
      # by reading it: a missing base digest, an extra that no longer resolves, or a wheel
      # that started needing a compiler all look identical in review and all fail here.
      - name: Build the scoring image
        run: docker build -f deploy/docker/api.Dockerfile -t fraudlens/api:ci .

      - name: Manifests, compose file and composition root
        run: uv run pytest tests/deploy -m "not integration" -q
